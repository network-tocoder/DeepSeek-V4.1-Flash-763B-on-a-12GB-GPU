<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lighthouse Night</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070f;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function () {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let stars = [];
  let clouds = [];
  let waves = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
    buildClouds();
    buildWaves();
  }

  function buildStars() {
    stars = [];
    const count = Math.floor((W * H) / 6000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.75,
        r: Math.random() * 1.4 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 1.5 + 0.5,
        baseAlpha: Math.random() * 0.6 + 0.3
      });
    }
  }

  function buildClouds() {
    clouds = [];
    const count = 7;
    for (let i = 0; i < count; i++) {
      clouds.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.45 + 20,
        scale: Math.random() * 0.8 + 0.5,
        speed: Math.random() * 12 + 6,
        alpha: Math.random() * 0.18 + 0.08,
        puffs: Array.from({ length: 5 }, () => ({
          dx: (Math.random() - 0.5) * 120,
          dy: (Math.random() - 0.5) * 30,
          r: Math.random() * 40 + 20
        }))
      });
    }
  }

  function buildWaves() {
    waves = [];
    const layers = 4;
    for (let i = 0; i < layers; i++) {
      waves.push({
        yBase: H * 0.72 + i * 35,
        amp: 10 + i * 6,
        freq: 0.012 + i * 0.005,
        speed: 0.6 + i * 0.25,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.35 - i * 0.06
      });
    }
  }

  // Lighthouse position
  function lighthousePos() {
    return { x: W * 0.72, y: H * 0.62 };
  }

  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#060b1c');
    g.addColorStop(0.5, '#0c1830');
    g.addColorStop(1, '#132340');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Moon glow
    ctx.save();
    const moonX = W * 0.18;
    const moonY = H * 0.18;
    const glow = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, 120);
    glow.addColorStop(0, 'rgba(200,220,255,0.35)');
    glow.addColorStop(0.4, 'rgba(140,170,220,0.12)');
    glow.addColorStop(1, 'rgba(140,170,220,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 120, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(230,240,255,0.9)';
    ctx.beginPath();
    ctx.arc(moonX, moonY, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStars(t) {
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
      const a = s.baseAlpha * (0.4 + 0.6 * tw);
      ctx.fillStyle = 'rgba(220,235,255,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (0.7 + 0.5 * tw), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawClouds(t) {
    for (const c of clouds) {
      const x = ((c.x + t * c.speed) % (W + 300)) - 150;
      ctx.save();
      ctx.globalAlpha = c.alpha;
      ctx.fillStyle = '#7a90b8';
      for (const p of c.puffs) {
        ctx.beginPath();
        ctx.arc(x + p.dx * c.scale, c.y + p.dy * c.scale, p.r * c.scale, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawCliff() {
    const lh = lighthousePos();
    ctx.save();

    // Cliff silhouette
    ctx.beginPath();
    ctx.moveTo(lh.x - 220, H);
    ctx.lineTo(lh.x - 180, H * 0.72);
    ctx.lineTo(lh.x - 120, H * 0.68);
    ctx.lineTo(lh.x - 60, H * 0.66);
    ctx.lineTo(lh.x + 20, H * 0.65);
    ctx.lineTo(lh.x + 80, H * 0.68);
    ctx.lineTo(lh.x + 140, H * 0.72);
    ctx.lineTo(lh.x + 220, H);
    ctx.closePath();

    const cliffGrad = ctx.createLinearGradient(0, H * 0.55, 0, H);
    cliffGrad.addColorStop(0, '#1a2234');
    cliffGrad.addColorStop(1, '#0a101d');
    ctx.fillStyle = cliffGrad;
    ctx.fill();

    // Cliff highlight edge
    ctx.strokeStyle = 'rgba(90,120,160,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawLighthouse(t) {
    const lh = lighthousePos();
    const baseX = lh.x;
    const baseY = H * 0.66;
    const topY = H * 0.42;
    const towerW = 42;

    // Tower body
    ctx.save();
    const grad = ctx.createLinearGradient(baseX - towerW / 2, 0, baseX + towerW / 2, 0);
    grad.addColorStop(0, '#2a3548');
    grad.addColorStop(0.5, '#4a5a70');
    grad.addColorStop(1, '#1e2736');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(baseX - towerW / 2, baseY);
    ctx.lineTo(baseX - towerW / 2 + 6, topY);
    ctx.lineTo(baseX + towerW / 2 - 6, topY);
    ctx.lineTo(baseX + towerW / 2, baseY);
    ctx.closePath();
    ctx.fill();

    // Stripes
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (let i = 0; i < 3; i++) {
      const y = baseY - (baseY - topY) * (i / 3);
      ctx.fillRect(baseX - towerW / 2 + 2, y - 4, towerW - 4, 3);
    }

    // Lantern room
    ctx.fillStyle = '#1a2436';
    ctx.fillRect(baseX - towerW / 2 - 4, topY - 18, towerW + 8, 18);
    ctx.fillStyle = 'rgba(255,240,180,0.85)';
    ctx.fillRect(baseX - towerW / 2 + 2, topY - 14, towerW - 4, 10);

    // Roof
    ctx.fillStyle = '#0e1624';
    ctx.beginPath();
    ctx.moveTo(baseX - towerW / 2 - 10, topY - 18);
    ctx.lineTo(baseX, topY - 34);
    ctx.lineTo(baseX + towerW / 2 + 10, topY - 18);
    ctx.closePath();
    ctx.fill();

    // Light bulb glow at top
    const glow = ctx.createRadialGradient(baseX, topY - 10, 0, baseX, topY - 10, 50);
    glow.addColorStop(0, 'rgba(255,240,180,0.9)');
    glow.addColorStop(0.4, 'rgba(255,220,120,0.35)');
    glow.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(baseX, topY - 10, 50, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    return { x: baseX, y: topY - 10 };
  }

  function drawBeam(t, lh) {
    const beamAngle = t * 0.7;
    const beamLength = Math.max(W, H) * 1.1;
    const beamWidth = 0.16;

    ctx.save();
    ctx.translate(lh.x, lh.y);

    // Two beams (front and back), rotating
    for (let k = 0; k < 2; k++) {
      const angle = beamAngle + k * Math.PI;
      ctx.save();
      ctx.rotate(angle);

      const beamGrad = ctx.createLinearGradient(0, 0, beamLength, 0);
      beamGrad.addColorStop(0, 'rgba(255,245,200,0.55)');
      beamGrad.addColorStop(0.3, 'rgba(255,235,160,0.22)');
      beamGrad.addColorStop(1, 'rgba(255,235,160,0)');

      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(beamLength, -beamLength * beamWidth);
      ctx.lineTo(beamLength, beamLength * beamWidth);
      ctx.closePath();
      ctx.fill();

      // Inner brighter core
      const coreGrad = ctx.createLinearGradient(0, 0, beamLength, 0);
      coreGrad.addColorStop(0, 'rgba(255,250,220,0.35)');
      coreGrad.addColorStop(0.5, 'rgba(255,240,180,0.08)');
      coreGrad.addColorStop(1, 'rgba(255,240,180,0)');
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(beamLength, -beamLength * beamWidth * 0.4);
      ctx.lineTo(beamLength, beamLength * beamWidth * 0.4);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }
    ctx.restore();
  }

  function drawWaves(t) {
    for (const w of waves) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) {
        const y = w.yBase + Math.sin(x * w.freq + t * w.speed + w.phase) * w.amp
                  + Math.sin(x * w.freq * 2.3 + t * w.speed * 1.6 + w.phase * 1.3) * (w.amp * 0.4);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();

      const g = ctx.createLinearGradient(0, w.yBase - w.amp, 0, H);
      g.addColorStop(0, 'rgba(30,60,100,' + w.alpha + ')');
      g.addColorStop(1, 'rgba(8,16,30,' + (w.alpha + 0.15) + ')');
      ctx.fillStyle = g;
      ctx.fill();

      // Crest highlights
      ctx.strokeStyle = 'rgba(140,180,230,' + (w.alpha * 0.5) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 8) {
        const y = w.yBase + Math.sin(x * w.freq + t * w.speed + w.phase) * w.amp
                  + Math.sin(x * w.freq * 2.3 + t * w.speed * 1.6 + w.phase * 1.3) * (w.amp * 0.4);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawBeamReflection(t, lh) {
    // Soft reflection on the water
    const beamAngle = t * 0.7;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const rx = lh.x + Math.cos(beamAngle) * 80;
    const ry = H * 0.78;
    const g = ctx.createRadialGradient(rx, ry, 0, rx, ry, 120);
    g.addColorStop(0, 'rgba(255,240,180,0.18)');
    g.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(rx, ry, 130, 40, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  let startTime = performance.now();

  function frame() {
    const t = (performance.now() - startTime) / 1000;

    drawSky(t);
    drawStars(t);
    drawClouds(t);
    drawCliff();

    const lh = drawLighthouse(t);
    drawBeam(t, lh);
    drawBeamReflection(t, lh);
    drawWaves(t);

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
