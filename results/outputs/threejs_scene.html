<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Solar System</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 12px; left: 12px;
    color: rgba(255,255,255,0.6);
    font: 13px/1.4 system-ui, sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="hint">Drag to orbit the solar system</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(0, 9, 22);
camera.lookAt(0, 0, 0);

// ---------- Lights ----------
scene.add(new THREE.AmbientLight(0x223355, 0.35));

const sunLight = new THREE.PointLight(0xffcc88, 3.0, 120, 1.5);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// ---------- Starfield ----------
(function createStarfield() {
  const count = 2500;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    // Random point on a large sphere shell
    const r = 60 + Math.random() * 80;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.cos(phi);
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const c = 0.6 + Math.random() * 0.4;
    colors[i * 3]     = c;
    colors[i * 3 + 1] = c;
    colors[i * 3 + 2] = c * (0.9 + Math.random() * 0.2);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.55,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    depthWrite: false
  });

  scene.add(new THREE.Points(geo, mat));
})();

// ---------- Sun (glowing) ----------
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(2.2, 48, 48),
  new THREE.MeshStandardMaterial({
    color: 0xffb347,
    emissive: 0xff8a1f,
    emissiveIntensity: 1.6,
    roughness: 0.4
  })
);
scene.add(sun);

// Sun glow sprite
(function addSunGlow() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0.0, 'rgba(255, 200, 100, 0.85)');
  grad.addColorStop(0.35, 'rgba(255, 150, 60, 0.35)');
  grad.addColorStop(1.0, 'rgba(255, 120, 40, 0.0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);

  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: tex,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  sprite.scale.set(9, 9, 1);
  scene.add(sprite);
})();

// ---------- Planets ----------
// planetData: radius, orbit radius, color, speed, tilt
const planetData = [
  { radius: 0.55, orbit: 4.6,  color: 0x9b59b6, speed: 1.4, tilt: 0.15 },
  { radius: 0.85, orbit: 7.0,  color: 0x3498db, speed: 0.9, tilt: 0.25 },
  { radius: 1.15, orbit: 9.8,  color: 0xe67e22, speed: 0.65, tilt: 0.1 },
  { radius: 0.75, orbit: 12.6, color: 0x2ecc71, speed: 0.45, tilt: 0.3 }
];

const planets = [];

planetData.forEach((p, i) => {
  const pivot = new THREE.Group();
  pivot.rotation.x = p.tilt;
  scene.add(pivot);

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.radius, 32, 32),
    new THREE.MeshStandardMaterial({
      color: p.color,
      roughness: 0.7,
      metalness: 0.05
    })
  );
  mesh.position.set(p.orbit, 0, 0);
  pivot.add(mesh);

  // Orbit ring (thin line)
  const ringGeo = new THREE.RingGeometry(p.orbit - 0.02, p.orbit + 0.02, 96);
  const ringMat = new THREE.MeshBasicMaterial({
    color: p.color,
    transparent: true,
    opacity: 0.18,
    side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  pivot.add(ring);

  planets.push({ pivot, mesh, speed: p.speed, orbit: p.orbit, radius: p.radius });
});

// ---------- Ringed planet (the 3rd planet) ----------
(function addRingToPlanet() {
  const ringed = planets[2];

  const ringGeo = new THREE.RingGeometry(
    ringed.radius * 1.35,
    ringed.radius * 2.05,
    96
  );
  const ringMat = new THREE.MeshStandardMaterial({
    color: 0xffd27f,
    emissive: 0x553311,
    emissiveIntensity: 0.25,
    roughness: 0.6,
    metalness: 0.15,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.85
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2 - 0.35;
  ring.rotation.z = 0.15;
  ringed.mesh.add(ring);
})();

// ---------- Moon around the 2nd planet ----------
const moonPivot = new THREE.Group();
planets[1].mesh.add(moonPivot);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(0.22, 24, 24),
  new THREE.MeshStandardMaterial({
    color: 0xdddddd,
    roughness: 0.9,
    metalness: 0.0
  })
);
moon.position.set(1.35, 0.15, 0);
moonPivot.add(moon);

// ---------- Manual mouse-drag orbit rotation ----------
let dragging = false;
let prevX = 0, prevY = 0;
let rotX = 0.35;   // camera orbit angles
let rotY = 0.0;
const orbitRadius = 24;

function updateCamera() {
  const x = orbitRadius * Math.sin(rotY) * Math.cos(rotX);
  const y = orbitRadius * Math.sin(rotX);
  const z = orbitRadius * Math.cos(rotY) * Math.cos(rotX);
  camera.position.set(x, y, z);
  camera.lookAt(0, 0, 0);
}
updateCamera();

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  prevX = e.clientX;
  prevY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  prevX = e.clientX;
  prevY = e.clientY;

  rotY -= dx * 0.008;
  rotX += dy * 0.008;

  // Clamp vertical angle so camera doesn't flip
  const maxX = Math.PI / 2 - 0.05;
  const minX = -Math.PI / 2 + 0.05;
  rotX = Math.max(minX, Math.min(maxX, rotX));

  updateCamera();
});

renderer.domElement.addEventListener('pointerup', () => {
  dragging = false;
});

renderer.domElement.addEventListener('pointercancel', () => {
  dragging = false;
});

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Animation ----------
const clock = new THREE.Clock();

function animate() {
  const t = clock.getElapsedTime();

  // Planets orbit at different speeds
  planets.forEach((p) => {
    p.pivot.rotation.y = t * p.speed;
    p.mesh.rotation.y += 0.01;
  });

  // Moon orbits its planet
  moonPivot.rotation.y = t * 2.2;
  moonPivot.rotation.z = 0.3;

  // Sun pulse
  const pulse = 1 + Math.sin(t * 2.0) * 0.03;
  sun.scale.setScalar(pulse);
  sunLight.intensity = 3.0 + Math.sin(t * 2.0) * 0.25;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
